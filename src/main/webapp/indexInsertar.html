<html>
    <head>
        <title>Insertar Empleado</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <style>
            .BtnReturn
            {
                background-color: #008CBA;
                border: none;
                color: white;
                padding: 15px 32px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                cursor: pointer;
                margin: 5px
            }
            
            .BtnInsert
            {
                background-color: white;
                border: 2px solid #008CBA;
                color: cornflowerblue;
                padding: 15px 32px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                cursor: pointer;
                margin: 5px
            }
            
            .txtmargen
            {
                border: 2px solid #008CBA;
                margin: 15px;
            }
            
            
        </style>
    </head>
    <body>
        <div> 
        <h1> Insertar Empleado </h1>
        <form id="InsercionForm" novalidate> 
        
         <div>
            <label>Nombre: </label>
            <input class= "txtmargen" 
                   type="text" id="nombreE" required>
           
        </div>
        
        <div>
            <label>Salario: </label>
            <input class= "txtmargen" 
                   type="text" id="SalarioE" required>
           
        </div>
        <div>
            <button class = "BtnReturn" 
                    onclick="window.location.href='indexEmpleado.html'">Regresar</button>  
            <button class = "BtnInsert"
                    type = "submit">Insertar</button>
            <div id="message" style="margin-top: 10px; text-align:center;"></div>
            
        </div>      
       </form>
     </div>
 
       
        
        
  
    </body>
    
    <script>
    const form = document.getElementById('InsercionForm');

    form.addEventListener('submit', function(event) 
    {
        event.preventDefault();
        const msg = document.getElementById('message'); // Mensaje de insercion correcta o no

        if(!this.checkValidity()) 
        {
            msg.textContent = 'Por favor rellene todo los espacios requeridos';
            msg.style.color = 'red';
            return;
        } 
        else 
        {
            const nom = document.getElementById('nombreE').value.trim();
            const monto = document.getElementById('SalarioE').value.trim();
            
            console.log('EL SCRIPT SE CARGÓ');
            
            // Patrones regex de validar el nombre y saldo
            const ValiNom = /^[a-zA-ZáéíóúÁÉÍÓÚñÑ -]+$/;
            const ValiSaldo = /^\d+(\.\d{2,4})?$/;
            
            if(!ValiNom.test(nom))
            {
            msg.textContent = 'Por favor el nombre solamente con\n\
                valores alfabeticos o con un guion de separacion';
            msg.style.color = 'red';
            return; 
            }
            
            if(!ValiSaldo.test(monto))
            {
            msg.textContent = 'Por favor el saldo digitado debe de ser\n\
                digitos o punto decimal de no mas 2 o 4 decimales';
            msg.style.color = 'red';
            return; 
            }
        

            const NEmpleado = { 
                nombre: nom, 
                salario: parseFloat(monto) 
            };

            fetch('/Tarea1Conceptos/ServletEmpleado', 
            {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(NEmpleado)
            })
            .then(response => response.json())
            .then(insercion => 
            {
                if(insercion.exito) 
                {
                    msg.textContent = 'El empleado se insertó en la lista';
                    msg.style.color = 'green';
                    form.reset();
                    
                    // Tardea un toque para enseñar el mensaje de insercion
                    setTimeout(function(){
                         window.location.href='indexEmpleado.html';
                        
                    }, 2000);
   
                }else
                {
                    msg.textContent = insercion.mensaje;
                   msg.style.color = 'red';
                    
                }
            })
            .catch(error => console.error('ERROR', error));
        }
    });

                

    </script>
    
</html>
