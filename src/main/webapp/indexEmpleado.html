<!DOCTYPE html>
<html>
    <head>
        <title>Empleados</title>
        <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" 
              rel="stylesheet">
        <style>
            .ListE
            {
                border-collapse: collapse;
            }
            .ListE th,
            .ListE td 
            {
              border: 1px solid #ccc;
              padding: 10px 
            }
            .ListE thead th
            {
              background-color: #008CBA;
              color: white;
            }
              
            .ListE tbody td 
            {
                background-color: white;
                color: black;
            }
    
             .BtnInsert
            {
                background-color: #008CBA;
                border: none;
                color: white;
                padding: 15px 32px;
                text-align: center;
                text-decoration: none;
                display: inline-block;
                font-size: 16px;
                cursor: pointer;
                margin: 5px
            }
            
        </style>
    </head>
    <body>
        <h1>Lista de Empleados</h1>
        <table class = "ListE">
            <thead>
            <tr>
                <th>id</th>
                <th>Nombre</th>
                <th>Salario</th>
            </tr>
            </thead>
            <tbody id="tablacuerpo">
           
                
            </tbody>

        </table>
        <!-- Aqui vendria los datos de la tabla por columna -->  
        <script>
           fetch('/Tarea1Conceptos/ServletEmpleado')
              .then(response => response.json())
              .then(empleados =>
               {
                   const cuerpo = document.getElementById('tablacuerpo');
                   
                   empleados.forEach(e =>
                   {
                      const fila = document.createElement('tr');
                      fila.innerHTML = `<td>${e.id}</td> 
                                        <td>${e.nombre}</td>
                                         <td>${e.salario}</td>`;
                      cuerpo.appendChild(fila);
                   });
          
                }).catch(error => 
                console.error('ERROR: NO SE PUDO CARGAR EMPLEADOS:', error));
            
            
            
        </script>
        
        
        <button class ="BtnInsert"
            onclick="window.location.href='indexInsertar.html'">Insertar</button>
        
    </body>
</html>
